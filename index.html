  /* ---------------- historial de búsquedas (local) ---------------- */
  var MAX_HIST = 60;

  function recordSearch(termino) {
    if (demo || !state.useHistory) return;
    var q = termino.trim();
    if (q.length < 2) return;
    state.history = state.history || [];
    var ya = state.history.filter(function (h) { return h.q === q; })[0];
    if (ya) { ya.n++; ya.at = Date.now(); }
    else state.history.unshift({ q: q, n: 1, at: Date.now() });
    // se ordena por uso y luego por recencia, y se recorta
    state.history.sort(function (a, b) { return (b.n - a.n) || (b.at - a.at); });
    state.history = state.history.slice(0, MAX_HIST);
    save();
  }

  function buscarHistorial(v) {
    if (!state.useHistory || !state.history) return [];
    return state.history
      .filter(function (h) { return h.q.toLowerCase().indexOf(v) >= 0 && h.q.toLowerCase() !== v; })
      .slice(0, 3)
      .map(function (h) { return { kind: "history", q: h.q }; });
  }

  /* ---------------- sugerencias remotas (opcionales) ---------------- */
  var temporizador = null;
  var jsonpN = 0;
  var jsonpActual = null;

  function limpiarJsonp() {
    if (!jsonpActual) return;
    var j = jsonpActual;
    jsonpActual = null;
    if (j.timer) window.clearTimeout(j.timer);
    try { delete window[j.nombre]; } catch (e) { window[j.nombre] = undefined; }
    if (j.script && j.script.parentNode) j.script.parentNode.removeChild(j.script);
  }

  // convierte la respuesta OpenSearch ["consulta", ["s1","s2"]] en nuestro formato
  function parseOpenSearch(d) {
    var lista = (Array.isArray(d) && Array.isArray(d[1])) ? d[1] : [];
    return lista.slice(0, 4).map(function (x) {
      return { kind: "remote", q: typeof x === "string" ? x : (x && x.phrase) || "" };
    }).filter(function (x) { return x.q; });
  }

  function pedirRemotas(v, cb) {
    if (!state.useRemote) return cb([]);

    // el buscador propio se pide por fetch: JSONP ejecutaría código de una URL
    // que no controlamos, y aquí la pone el usuario
    if (state.engine === "custom") {
      if (!state.customSuggest) return cb([]);
      fetch(state.customSuggest.replace("%s", encodeURIComponent(v)),
            { credentials: "omit", referrerPolicy: "no-referrer" })
        .then(function (r) { return r.json(); })
        .then(function (d) { cb(parseOpenSearch(d)); })
        .catch(function () { cb([]); });
      return;
    }

    var plantilla = SUGGEST[state.engine];
    if (!plantilla) return cb([]);           // Brave y Startpage no tienen endpoint

    limpiarJsonp();
    var nombre = "__zaguanSug" + (++jsonpN);
    var script = document.createElement("script");
    var j = { nombre: nombre, script: script, timer: null };
    jsonpActual = j;

    window[nombre] = function (d) {
      if (jsonpActual !== j) return;         // llegó tarde, ya hay otra consulta
      limpiarJsonp();
      cb(parseOpenSearch(d));
    };

    script.src = plantilla
      .replace("%cb", nombre)
      .replace("%lang", lang)
      .replace("%s", encodeURIComponent(v));
    script.referrerPolicy = "no-referrer";
    script.onerror = function () { if (jsonpActual === j) { limpiarJsonp(); cb([]); } };
    j.timer = window.setTimeout(function () {
      if (jsonpActual === j) { limpiarJsonp(); cb([]); }
    }, 3000);

    document.head.appendChild(script);
  }

  function allLinks() {
    var out = [];
    state.items.forEach(function (i) {
      if (i.kind === "link") out.push({ where: t("desktop"), link: i });
      else i.links.forEach(function (l) { out.push({ where: i.name, link: l }); });
    });
    return out;
  }

  function paintHits() {
    hits.textContent = "";
    if (!current.length) { hits.hidden = true; return; }
    current.forEach(function (e, i) {
      var a = document.createElement("a");
      a.className = "hit hit-" + (e.kind || "link");
      a.setAttribute("role", "option");
      a.setAttribute("aria-selected", i === sel ? "true" : "false");

      var n = document.createElement("span");
      var p = document.createElement("span");
      p.className = "path";

      if (e.kind === "history" || e.kind === "remote") {
        a.href = searchUrl(e.q);
        n.textContent = e.q;
        p.textContent = e.kind === "history" ? t("historyTag") : ENGINES[state.engine].label;
      } else {
        a.href = normalize(e.link.url);
        n.textContent = e.link.name;
        p.textContent = e.where + " · " + host(e.link.url);
      }

      a.appendChild(n); a.appendChild(p);
      a.addEventListener("mouseenter", function () { sel = i; paintHits(); });
      hits.appendChild(a);
    });
    hits.hidden = false;
  }

  // combina favoritos, historial y sugerencias remotas sin repetir
  function componer(v, remotas) {
    var favoritos = allLinks().filter(function (e) {
      return e.link.name.toLowerCase().indexOf(v) >= 0 || e.link.url.toLowerCase().indexOf(v) >= 0;
    }).slice(0, 4).map(function (e) { return { kind: "link", where: e.where, link: e.link }; });

    var vistas = {};
    var salida = favoritos.slice();
    buscarHistorial(v).concat(remotas || []).forEach(function (x) {
      var clave = x.q.toLowerCase();
      if (vistas[clave]) return;
      vistas[clave] = true;
      salida.push(x);
    });
    return salida.slice(0, 8);
  }

  q.addEventListener("input", function () {
    var v = q.value.trim().toLowerCase();
    if (temporizador) window.clearTimeout(temporizador);
    if (!v) { current = []; sel = -1; paintHits(); return; }

    // lo local se pinta ya; lo remoto llega después y no debe mover la selección
    current = componer(v, []);
    sel = current.length ? 0 : -1;
    paintHits();

    if (!state.useRemote || looksLikeUrl(v)) return;
    temporizador = window.setTimeout(function () {
      pedirRemotas(v, function (remotas) {
        if (q.value.trim().toLowerCase() !== v) return;   // el usuario ya escribió otra cosa
        var elegido = sel >= 0 ? current[sel] : null;
        current = componer(v, remotas);
        sel = 0;
        if (elegido) {
          for (var i = 0; i < current.length; i++) {
            var mismo = elegido.kind === "link"
              ? (current[i].link && current[i].link.id === elegido.link.id)
              : (current[i].q === elegido.q);
            if (mismo) { sel = i; break; }
          }
        }
        paintHits();
      });
    }, 220);
  });

  q.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      if (!current.length) return;
      ev.preventDefault();
      sel += ev.key === "ArrowDown" ? 1 : -1;
      if (sel < 0) sel = current.length - 1;
      if (sel >= current.length) sel = 0;
      paintHits();
      return;
    }
    if (ev.key === "Escape") { q.value = ""; current = []; paintHits(); q.blur(); return; }
    if (ev.key !== "Enter") return;
    var v = q.value.trim();
    if (!v) return;
    ev.preventDefault();
    var newTab = ev.ctrlKey || ev.metaKey;
    var elegido = sel >= 0 ? current[sel] : null;
    if (elegido && !looksLikeUrl(v)) {
      if (elegido.kind === "history" || elegido.kind === "remote") {
        recordSearch(elegido.q);
        go(searchUrl(elegido.q), newTab);
      } else {
        go(normalize(elegido.link.url), newTab);
      }
    } else if (looksLikeUrl(v)) {
      go(normalize(v), newTab);
    } else {
      recordSearch(v);
      go(searchUrl(v), newTab);
    }
  });

  function engineLabel() { document.getElementById("engineBtn").textContent = ENGINES[state.engine].label; }
  document.getElementById("engineBtn").addEventListener("click", function () {
    var keys = Object.keys(ENGINES).filter(function (k) { return k !== "custom" || state.custom; });
    var i = keys.indexOf(state.engine);
    state.engine = keys[(i + 1) % keys.length];
    engineLabel(); save(); q.focus();
  });

  /* ---------------- copias de seguridad ---------------- */
  var backupsEl = document.getElementById("backups");

  function loadBackups() {
    if (!persistent) return [];
    try { return JSON.parse(window.localStorage.getItem(BKEY)) || []; } catch (e) { return []; }
  }
  function storeBackups(list) {
    if (!persistent) return false;
    try { window.localStorage.setItem(BKEY, JSON.stringify(list.slice(0, MAX_BACKUPS))); return true; }
    catch (e) { return false; }
  }
  function makeBackup(auto) {
    if (!persistent) return null;
    var list = loadBackups();
    var snapshot = JSON.parse(JSON.stringify(state));
    if (list.length && JSON.stringify(list[0].data.items) === JSON.stringify(snapshot.items)) return null;
    list.unshift({ at: Date.now(), auto: !!auto, data: snapshot });
    return storeBackups(list) ? list[0] : null;
  }
  function formatWhen(ts) {
    return new Date(ts).toLocaleString(I18N[lang]._locale, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function paintBackups() {
    backupsEl.textContent = "";
    if (!persistent) {
      var p = document.createElement("li");
      p.style.fontSize = "12.5px"; p.style.color = "var(--muted)";
      p.className = "vacio";
      p.textContent = t("storageNoSave");
      backupsEl.appendChild(p);
      return;
    }
    if (persistent && !loadBackups().length) {
      var vacio = document.createElement("li");
      vacio.className = "vacio";
      vacio.textContent = t("noBackups");
      backupsEl.appendChild(vacio);
    }
    loadBackups().forEach(function (bk, i) {
      var data = migrate(JSON.parse(JSON.stringify(bk.data)));
      var li = document.createElement("li");
      li.className = "backup";

      var info = document.createElement("div");
      var when = document.createElement("div");
      when.className = "when"; when.textContent = formatWhen(bk.at);
      var meta = document.createElement("div");
      meta.className = "meta";
      var nf = data.items.filter(function (x) { return x.kind === "folder"; }).length;
      meta.textContent = t("backupMeta", { folders: nf, links: totalLinks(data) }) + (bk.auto ? t("backupAuto") : "");
      info.appendChild(when); info.appendChild(meta);

      var sp = document.createElement("div");
      sp.className = "sp";

      var restore = document.createElement("button");
      restore.className = "mini-btn";
      restore.textContent = t("restore");
      restore.addEventListener("click", function () {
        if (!window.confirm(t("confirmRestore", { date: formatWhen(bk.at) }))) return;
        makeBackup(true);
        state = migrate(JSON.parse(JSON.stringify(bk.data))) || freshState();
        save(); applyTheme(); engineLabel(); render();
        if (openId) closeFolder();
        paintBackups();
      });

      var del = document.createElement("button");
      del.className = "mini-btn";
      del.textContent = "×";
      del.title = t("deleteBackup");
      del.addEventListener("click", function () {
        var list = loadBackups();
        list.splice(i, 1);
        storeBackups(list);
        paintBackups();
      });

      sp.appendChild(restore); sp.appendChild(del);
      li.appendChild(info); li.appendChild(sp);
      backupsEl.appendChild(li);
    });
  }

  document.getElementById("bMake").addEventListener("click", function () {
    var made = makeBackup(false);
    paintBackups();
    if (!made) window.alert(t("noChanges"));
  });

  (function autoBackup() {
    if (!persistent) return;
    var list = loadBackups();
    var today = new Date().toDateString();
    var already = list.some(function (b) { return new Date(b.at).toDateString() === today; });
    if (!already) makeBackup(true);
  })();

  /* ---------------- ajustes ---------------- */
  var cfgDlg = document.getElementById("cfgDlg");
  var cEngine = document.getElementById("cEngine");
  Object.keys(ENGINES).forEach(function (k) {
    var o = document.createElement("option");
    o.value = k; o.textContent = ENGINES[k].label;
    cEngine.appendChild(o);
  });

  // selector de idioma
  var cLang = document.getElementById("cLang");
  var optAuto = document.createElement("option");
  optAuto.value = "auto";
  cLang.appendChild(optAuto);
  Object.keys(I18N).forEach(function (code) {
    var o = document.createElement("option");
    o.value = code; o.textContent = I18N[code]._name;
    cLang.appendChild(o);
  });
  cLang.addEventListener("change", function () {
    state.lang = cLang.value;
    lang = resolveLang(state.lang);
    save(); applyI18n(); paintUiText(); render();
    if (openId) paintApps();
  });

  // textos generados por JS que hay que repintar al cambiar de idioma
  function paintUiText() {
    optAuto.textContent = t("languageAuto");
    cLang.value = state.lang || "auto";
    paintModes(); paintStyles(); applyTheme();
    pickerWrap.title = t("ownColor");
  }

  var PALETTE = [236, 172, 210, 258, 300, 22, 62, 128];   // 236 = azul Plasma de Breeze
  var seedsEl = document.getElementById("seeds");
  PALETTE.forEach(function (h) {
    var b = document.createElement("button");
    b.className = "seed";
    b.style.background = "oklch(0.72 0.15 " + h + ")";
    b.dataset.hue = h;
    b.setAttribute("aria-label", t("hueLabel", { n: h }));
    b.addEventListener("click", function () { state.hue = h; applyTheme(); save(); paintSeeds(); });
    seedsEl.appendChild(b);
  });
  var pickerWrap = document.createElement("span");
  pickerWrap.className = "seed-picker";
  pickerWrap.title = t("ownColor");
  var picker = document.createElement("input");
  picker.type = "color";
  picker.value = "#3fbfb0";
  picker.setAttribute("aria-label", t("ownColor"));
  picker.addEventListener("input", function () {
    state.hue = hexToHue(picker.value);
    applyTheme(); save(); paintSeeds();
  });
  pickerWrap.appendChild(picker);
  seedsEl.appendChild(pickerWrap);

  function paintSeeds() {
    var known = false;
    Array.prototype.forEach.call(seedsEl.querySelectorAll(".seed"), function (b) {
      var on = Number(b.dataset.hue) === state.hue;
      if (on) known = true;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    // la rueda queda marcada cuando el tono no es ninguno de los predefinidos
    pickerWrap.dataset.active = known ? "false" : "true";
  }

  var stylesEl = document.getElementById("styles");
  stylesEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    state.style = b.dataset.style;
    applyTheme(); save(); paintStyles();
  });
  function paintStyles() {
    Array.prototype.forEach.call(stylesEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.style === (state.style || "material") ? "true" : "false");
    });
  }

  var modesEl = document.getElementById("modes");
  modesEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    state.mode = b.dataset.mode;
    applyTheme(); save(); paintModes();
  });
  function paintModes() {
    Array.prototype.forEach.call(modesEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === state.mode ? "true" : "false");
    });
  }

  document.getElementById("cfgBtn").addEventListener("click", function () {
    cEngine.value = state.engine;
    document.getElementById("cCustom").value = state.custom || "";
    document.getElementById("cFavicons").checked = !!state.favicons;
    document.getElementById("cHistory").checked = !!state.useHistory;
    document.getElementById("cRemote").checked = !!state.useRemote;
    avisoSinSugerencias();
    paintSeeds(); paintModes(); paintStyles(); paintBackups();
    cfgDlg.showModal();
  });
  cEngine.addEventListener("change", function () {
    state.engine = cEngine.value; engineLabel(); save(); avisoSinSugerencias();
  });
  document.getElementById("cCustom").addEventListener("change", function (ev) { state.custom = ev.target.value.trim(); save(); });
  document.getElementById("cFavicons").addEventListener("change", function (ev) {
    state.favicons = ev.target.checked; commit();
  });
  document.getElementById("cHistory").addEventListener("change", function (ev) {
    state.useHistory = ev.target.checked; save();
  });
  document.getElementById("cRemote").addEventListener("change", function (ev) {
    state.useRemote = ev.target.checked; save(); avisoSinSugerencias();
  });

  // avisa si el buscador elegido no tiene endpoint, para que no parezca averiado
  function avisoSinSugerencias() {
    var el = document.getElementById("sinSug");
    var hay = state.engine === "custom" ? !!state.customSuggest : !!SUGGEST[state.engine];
    if (state.useRemote && !hay) {
      el.textContent = t("noSuggest", { engine: ENGINES[state.engine].label });
      el.hidden = false;
    } else {
      el.hidden = true;
    }
  }
  document.getElementById("bClearHist").addEventListener("click", function () {
    state.history = [];
    save();
    window.alert(t("clearHistory") + " \u2713");
  });
  document.getElementById("cClose").addEventListener("click", function () { cfgDlg.close(); });

  document.getElementById("cExport").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "inicio-favoritos.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("cImport").addEventListener("click", function () { document.getElementById("cFile").click(); });
  document.getElementById("cFile").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = migrate(JSON.parse(r.result));
        if (!data) throw new Error("formato");
        makeBackup(true);
        state = data;
        save(); applyTheme(); engineLabel(); render(); paintBackups();
        ev.target.value = "";
        cfgDlg.close();
      } catch (e) {
        window.alert(t("importError"));
      }
    };
    r.readAsText(file);
  });

  /* ---------------- edición, reloj, teclado ---------------- */
  function toggleEdit() {
    var on = document.body.classList.toggle("editing");
    document.getElementById("editBtn").classList.toggle("on", on);
    titleEl.readOnly = !on;
  }
  document.getElementById("editBtn").addEventListener("click", toggleEdit);

  function tick() {
    var d = new Date();
    document.getElementById("time").textContent =
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    document.getElementById("date").textContent =
      d.toLocaleDateString(I18N[lang]._locale, { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  window.setInterval(tick, 15000);

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && openId !== null) { closeFolder(); return; }
    if (ev.target.matches("input, select, textarea")) return;
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    if (ev.key === "/") { ev.preventDefault(); q.focus(); return; }
    if (ev.key === "e" || ev.key === "E") { toggleEdit(); return; }
    if (openId === null && /^[\wáéíóúñ]$/i.test(ev.key)) q.focus();
  });

  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".console")) { current = []; paintHits(); }
  });

  var VERSION = "1.13.0";
  document.getElementById("version").textContent =
    "Zaguán " + VERSION + " · " + (window.PointerEvent ? "arrastre por puntero" : "sin PointerEvent");

  applyI18n();
  paintUiText();
  applyTheme();
  engineLabel();
  render();
  q.focus();
})();
</script>
</body>
</html>
