<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="appTitle">Home</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
  :root {
    --hue: 172;

    --bg:        oklch(0.17 0.028 var(--hue));
    --bg-2:      oklch(0.21 0.035 var(--hue));
    --surface:   oklch(0.24 0.038 var(--hue) / 0.72);
    --surface-2: oklch(0.30 0.045 var(--hue) / 0.85);
    --outline:   oklch(0.42 0.035 var(--hue) / 0.5);
    --text:      oklch(0.94 0.018 var(--hue));
    --muted:     oklch(0.74 0.030 var(--hue));
    --primary:   oklch(0.82 0.115 var(--hue));
    --on-primary:oklch(0.24 0.060 var(--hue));
    --shadow:    0 18px 46px -18px oklch(0.08 0.04 var(--hue) / 0.85);
    --scrim:     oklch(0.12 0.02 var(--hue) / 0.55);

    --font: "SF Pro Display", "Inter", "Noto Sans", "Cantarell", "Segoe UI Variable",
            system-ui, -apple-system, sans-serif;

    /* tokens que cambian según el estilo elegido */
    --blur-1: 20px;
    --blur-2: 26px;
    --blur-3: 30px;
    --sat: 165%;
    --r-face: 24px;
    --r-panel: 32px;
    --mesh-op: 0.75;
    --glass: 0 0 0 0 transparent;
    --tile: 74px;
    --field-h: 64px;
    --r-field: 999px;
    --r-chip: 999px;
    --r-mini: 8px;
    --r-app: 18px;
    --font-display: var(--font);
    --icon-filter: none;
    --icon-gloss: 0;
    --label-tt: none;
    --label-ls: -0.011em;
    --label-fs: 12.5px;
    --grid-gap: 22px 14px;

    --spring: cubic-bezier(0.2, 0.9, 0.25, 1.2);
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  /* modo claro base: lo heredan los estilos que no definan el suyo propio */
  html[data-mode="light"] {
    --bg:        oklch(0.965 0.014 var(--hue));
    --bg-2:      oklch(0.93 0.028 var(--hue));
    --surface:   oklch(1 0 0 / 0.66);
    --surface-2: oklch(0.99 0.012 var(--hue) / 0.9);
    --outline:   oklch(0.72 0.03 var(--hue) / 0.6);
    --text:      oklch(0.28 0.04 var(--hue));
    --muted:     oklch(0.52 0.035 var(--hue));
    --primary:   oklch(0.55 0.135 var(--hue));
    --on-primary:oklch(0.99 0.01 var(--hue));
    --shadow:    0 18px 40px -20px oklch(0.5 0.05 var(--hue) / 0.45);
    --scrim:     oklch(0.75 0.03 var(--hue) / 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }

  /* ---------- fondo dinámico ---------- */
  .mesh { position: fixed; inset: -20%; z-index: -1; filter: blur(90px); opacity: var(--mesh-op); pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; }
  .blob:nth-child(1) { width: 52vw; height: 52vw; left: 4%; top: 2%;
    background: oklch(0.62 0.16 var(--hue) / 0.55); animation: drift1 26s var(--ease) infinite alternate; }
  .blob:nth-child(2) { width: 44vw; height: 44vw; right: 6%; top: 18%;
    background: oklch(0.60 0.15 calc(var(--hue) + 55) / 0.42); animation: drift2 32s var(--ease) infinite alternate; }
  .blob:nth-child(3) { width: 46vw; height: 46vw; left: 28%; bottom: -8%;
    background: oklch(0.58 0.14 calc(var(--hue) - 45) / 0.38); animation: drift3 38s var(--ease) infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(9vw, 6vh, 0) scale(1.12); } }
  @keyframes drift2 { to { transform: translate3d(-8vw, 9vh, 0) scale(0.92); } }
  @keyframes drift3 { to { transform: translate3d(6vw, -7vh, 0) scale(1.08); } }

  .wrap { max-width: 940px; margin: 0 auto; padding: 26px 24px 90px; }

  /* ---------- barra superior ---------- */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .now { display: flex; flex-direction: column; }
  .now .h { font-family: var(--font-display); font-size: 40px; font-weight: 600;
            letter-spacing: -0.035em; line-height: 1; }
  .now .d { font-size: 13.5px; color: var(--muted); margin-top: 7px; text-transform: capitalize; }
  .actions { display: flex; gap: 8px; }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2.5px solid var(--primary); outline-offset: 3px; }

  .icon-btn {
    width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 50%; background: var(--surface);
    -webkit-backdrop-filter: blur(var(--blur-1)) saturate(var(--sat)); backdrop-filter: blur(var(--blur-1)) saturate(var(--sat));
    border: 1px solid var(--outline); color: var(--muted);
    transition: transform .22s var(--spring), background .2s var(--ease), color .2s var(--ease);
  }
  .icon-btn:hover { color: var(--text); transform: translateY(-2px); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.on { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8;
                  stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- buscador ---------- */
  .console { position: relative; margin: 44px 0 40px; }
  .field {
    display: flex; align-items: center; gap: 14px;
    height: var(--field-h); padding: 0 10px 0 24px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--blur-2)) saturate(var(--sat)); backdrop-filter: blur(var(--blur-2)) saturate(var(--sat));
    border: 1px solid var(--outline); border-radius: var(--r-field); box-shadow: var(--shadow), var(--glass);
    transition: border-color .25s var(--ease), transform .3s var(--spring);
  }
  .field:focus-within { border-color: var(--primary); transform: translateY(-2px); }
  .field .glass { width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: var(--muted); stroke-width: 1.9; stroke-linecap: round; }
  .field:focus-within .glass { stroke: var(--primary); }
  #q { flex: 1 1 auto; min-width: 0; background: none; border: 0; padding: 0;
       font-family: inherit; font-size: 18px; letter-spacing: -0.015em; color: var(--text); }
  #q:focus { outline: none; }
  #q::placeholder { color: var(--muted); }
  .engine-chip {
    flex: 0 0 auto; height: calc(var(--field-h) * 0.7); padding: 0 18px; border-radius: var(--r-chip);
    background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 500;
    transition: color .2s var(--ease), transform .22s var(--spring);
  }
  .engine-chip:hover { color: var(--text); }
  .engine-chip:active { transform: scale(0.94); }

  .hits {
    position: absolute; left: 12px; right: 12px; top: calc(100% + 10px);
    background: var(--surface-2);
    -webkit-backdrop-filter: blur(var(--blur-2)) saturate(var(--sat)); backdrop-filter: blur(var(--blur-2)) saturate(var(--sat));
    border: 1px solid var(--outline); border-radius: 20px; box-shadow: var(--shadow);
    overflow: hidden; z-index: 40; animation: pop .22s var(--spring);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.985); } }
  .hits[hidden] { display: none; }
  .hit { display: flex; align-items: center; gap: 14px; padding: 13px 20px; text-decoration: none; color: var(--text); }
  .hit .path { margin-left: auto; font-size: 12px; color: var(--muted); }
  .hit[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
  .hit[aria-selected="true"] .path { color: var(--on-primary); opacity: .75; }

  /* ---------- rejilla del escritorio ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: var(--grid-gap);
    min-height: 120px;
    border-radius: var(--r-panel);
    transition: background .2s var(--ease);
  }
  .grid.drop-here { background: oklch(from var(--primary) l c h / 0.12); }

  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 0; position: relative;
    text-decoration: none; color: var(--text);
    animation: rise .45s var(--ease) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .tile.dragging, .app.dragging { opacity: .28; }

  /* en modo edición el gesto es arrastrar, no desplazar ni seleccionar */
  body.editing .tile, body.editing .app { touch-action: none; user-select: none; -webkit-user-select: none; }
  .tile img, .app img { -webkit-user-drag: none; user-drag: none; }

  /* Copia del icono que sigue al puntero.
     Lleva !important porque los estilos ponen position:relative a .face.single
     con más especificidad, y eso sacaba el fantasma del viewport. */
  html body .drag-ghost {
    position: fixed !important;
    left: 0; top: 0;
    z-index: 300;
    margin: 0 !important;
    pointer-events: none;
    transition: none !important;
    animation: none !important;
    will-change: transform;
    filter: drop-shadow(0 16px 28px oklch(0.08 0.03 var(--hue) / 0.55));
    opacity: .95;
  }

  /* los iconos se apartan para abrir hueco donde va a caer el que arrastras */
  .tile, .app { transition: transform .18s var(--ease); }
  .tile.shift-before { transform: translateX(14px); }
  .tile.shift-after  { transform: translateX(-14px); }
  .app.shift-before  { transform: translateX(12px); }
  .app.shift-after   { transform: translateX(-12px); }

  /* la carpeta que recibirá el enlace se hincha */
  .tile.drop-into .face { border-color: var(--primary); transform: scale(1.14); }

  .face {
    position: relative;
    width: var(--tile); height: var(--tile);
    border-radius: var(--r-face);
    box-shadow: var(--shadow), var(--glass);
    transition: transform .28s var(--spring), border-color .2s var(--ease);
  }
  .tile:hover .face { transform: translateY(-4px) scale(1.05); }
  .tile:active .face { transform: scale(0.94); }


  /* carpeta: rejilla 2x2 de miniaturas */
  .face.folder {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 5px; padding: 9px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--blur-1)) saturate(var(--sat)); backdrop-filter: blur(var(--blur-1)) saturate(var(--sat));
    border: 1px solid var(--outline);
  }
  .tile:hover .face.folder { border-color: var(--primary); }
  .mini { border-radius: var(--r-mini); display: grid; place-items: center; overflow: hidden;
          font-size: 11px; font-weight: 700; color: oklch(0.20 0.03 var(--hue)); text-transform: uppercase;
          filter: var(--icon-filter); }
  .mini.empty { background: var(--surface-2); }
  .mini img { width: 13px; height: 13px; display: block; }

  /* acceso suelto: icono único */
  .face.single {
    display: grid; place-items: center;
    border: 1px solid transparent;
    filter: var(--icon-filter);
    font-size: 30px; font-weight: 700;
    color: oklch(0.20 0.03 var(--hue));
    text-transform: uppercase;
    overflow: hidden;
  }
  .face.single img { width: 36px; height: 36px; display: block; }

  .more-badge {
    position: absolute; right: -5px; top: -5px;
    min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center; border-radius: 999px;
    background: var(--primary); color: var(--on-primary);
    font-size: 11.5px; font-weight: 700;
  }

  .tile-label { font-size: var(--label-fs); font-weight: 500; text-align: center; max-width: 96px;
                text-transform: var(--label-tt); letter-spacing: var(--label-ls);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-host { font-size: 10.5px; color: var(--muted); text-align: center; max-width: 96px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -7px; }

  .tile-del {
    display: none;
    position: absolute; top: -6px; left: -6px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg-2); color: var(--muted);
    font-size: 15px; line-height: 1; place-items: center;
    border: 1px solid var(--outline);
    z-index: 2;
  }
  .tile-del:hover { background: var(--primary); color: var(--on-primary); }
  body.editing .tile-del { display: grid; }

  .new-tile { display: none; }
  body.editing .new-tile { display: flex; }
  .new-tile .face {
    display: grid; place-items: center;
    background: none; border: 1px dashed var(--outline);
    color: var(--muted); font-size: 30px; font-weight: 300; line-height: 1;
    box-shadow: none;
  }
  .new-tile:hover .face { border-color: var(--primary); color: var(--primary); }

  .empty-desktop { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; padding: 20px 2px; }

  /* ---------- panel de carpeta abierta ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 60;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(var(--blur-2)); backdrop-filter: blur(var(--blur-2));
    display: grid; place-items: center; padding: 24px;
    opacity: 0; transition: opacity .28s var(--ease);
  }
  .scrim.open { opacity: 1; }
  .scrim[hidden] { display: none; }
  .scrim.drop-here { background: oklch(from var(--primary) l c h / 0.22); }

  .panel {
    width: min(560px, 100%); max-height: 82vh; overflow-y: auto;
    padding: 26px 28px 30px; border-radius: var(--r-panel);
    background: var(--surface-2);
    -webkit-backdrop-filter: blur(var(--blur-3)) saturate(var(--sat)); backdrop-filter: blur(var(--blur-3)) saturate(var(--sat));
    border: 1px solid var(--outline); box-shadow: var(--shadow), var(--glass);
  }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .panel-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.025em; background: none; border: 0;
                 color: var(--text); font-family: inherit; padding: 4px 8px; border-radius: 10px; min-width: 40px; }
  .panel-title:focus { outline: none; background: var(--surface); }
  .panel-close { margin-left: auto; }

  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 20px 8px; }

  .app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px;
         text-decoration: none; color: var(--text); transition: transform .24s var(--spring); }
  .app:hover { transform: translateY(-4px); }
  .app:active { transform: scale(0.93); }
  .app.dragging { opacity: .35; }

  .app-icon {
    width: 58px; height: 58px; display: grid; place-items: center;
    border-radius: var(--r-app); font-size: 23px; font-weight: 700;
    color: oklch(0.20 0.03 var(--hue)); text-transform: uppercase;
    filter: var(--icon-filter);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .app-icon img { width: 30px; height: 30px; display: block; }
  .app-label { font-size: 12.5px; text-align: center; max-width: 84px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-host { font-size: 10.5px; color: var(--muted); max-width: 84px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -6px; }
  .app-del { display: none; position: absolute; top: -4px; right: 8px;
             width: 22px; height: 22px; border-radius: 50%;
             background: var(--bg-2); color: var(--muted); font-size: 14px; line-height: 1; place-items: center; }
  .app-del:hover { background: var(--primary); color: var(--on-primary); }
  body.editing .app-del { display: grid; }

  .app.add .app-icon { background: none; border: 1px dashed var(--outline); color: var(--muted);
                       font-size: 26px; font-weight: 300; box-shadow: none; }
  .app.add { display: none; }
  body.editing .app.add { display: flex; }

  .panel-actions { display: none; margin-top: 24px; justify-content: flex-end; gap: 8px; }
  body.editing .panel-actions { display: flex; }
  .text-btn { height: 40px; padding: 0 18px; border-radius: 999px; font-size: 13.5px; color: var(--muted);
              transition: background .2s var(--ease), color .2s var(--ease); }
  .text-btn:hover { background: var(--primary); color: var(--on-primary); }

  .empty-note { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; text-align: center; padding: 12px 0; }

  .hint { margin-top: 36px; font-size: 12.5px; color: var(--muted); }
  .hint kbd { font: inherit; font-size: 11.5px; padding: 2px 7px; border-radius: 7px;
              background: var(--surface-2); color: var(--text); }

  .warn { margin: 18px 0 0; padding: 14px 18px; border-radius: 20px;
          background: var(--surface-2); border: 1px solid var(--primary); font-size: 13.5px; }
  .warn[hidden] { display: none; }

  /* ---------- diálogos ---------- */
  dialog {
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--outline); border-radius: 28px;
    padding: 26px; width: min(430px, 92vw); box-shadow: var(--shadow);
    max-height: 86vh; overflow-y: auto;
  }
  dialog::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  dialog[open] { animation: dlg .3s var(--spring); }
  @keyframes dlg { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  dialog h2 { font-family: var(--font-display); margin: 0 0 20px; font-size: 20px;
              font-weight: 600; letter-spacing: -0.02em; }

  label { display: block; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  label input[type="text"], label select {
    display: block; width: 100%; margin-top: 7px; height: 46px; padding: 0 15px;
    background: var(--surface-2); border: 1px solid var(--outline); border-radius: 14px;
    color: var(--text); font: inherit; font-size: 14.5px;
  }
  label.row { display: flex; align-items: center; gap: 10px; }

  .seeds { display: flex; gap: 10px; align-items: center; margin: 6px 0 18px; flex-wrap: wrap; }
  .seed { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
          transition: transform .24s var(--spring); }
  .seed:hover { transform: scale(1.14); }
  .seed[aria-pressed="true"] { border-color: var(--text); }

  .seed-picker {
    position: relative;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid transparent;
    display: grid; place-items: center;
    overflow: hidden;
    background: conic-gradient(from 0deg,
      oklch(0.72 0.19 25), oklch(0.80 0.17 70), oklch(0.85 0.19 130),
      oklch(0.80 0.13 180), oklch(0.68 0.17 250), oklch(0.65 0.22 310),
      oklch(0.72 0.19 25));
    transition: transform .24s var(--spring);
  }
  .seed-picker:hover { transform: scale(1.14); }
  .seed-picker[data-active="true"] { border-color: var(--text); }
  .seed-picker::after {
    content: ""; width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg-2);
  }
  .seed-picker input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; padding: 0; border: 0;
    cursor: pointer;
  }

  .segmented {
    display: flex; gap: 4px; padding: 4px;
    border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--outline);
    margin-bottom: 18px;
  }
  /* cinco opciones: se envuelven y cada fila reparte el ancho completo,
     asi no queda ninguna celda vacia */
  .segmented.styles {
    flex-wrap: wrap;
    border-radius: 20px;
  }
  .segmented.styles button { flex: 1 1 28%; min-width: 88px; }
  .segmented button { flex: 1; height: 36px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted);
                      transition: background .2s var(--ease), color .2s var(--ease); }
  .segmented button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

  .section-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; }
  .backups { margin: 0 0 12px; padding: 0; list-style: none; max-height: 190px; overflow-y: auto; }
  .backups .vacio { font-size: 12.5px; color: var(--muted); padding: 10px 2px; list-style: none; }
  .backup { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 7px;
            border-radius: 14px; background: var(--surface-2); }
  .backup .when { font-size: 13px; font-weight: 500; }
  .backup .meta { font-size: 11.5px; color: var(--muted); }
  .backup .sp { margin-left: auto; display: flex; gap: 6px; }
  .mini-btn { height: 32px; padding: 0 13px; border-radius: 999px; font-size: 12.5px;
              color: var(--muted); background: var(--surface);
              transition: background .2s var(--ease), color .2s var(--ease); }
  .mini-btn:hover { background: var(--primary); color: var(--on-primary); }
  .backup-tools { display: flex; flex-wrap: wrap; gap: 7px; }
  .aviso { margin: -6px 0 14px; font-size: 11.5px; line-height: 1.4; color: var(--muted); opacity: .85; }

  /* el origen de cada sugerencia se distingue con una marca discreta */
  .hit-history .path, .hit-remote .path { opacity: .75; }
  .hit-history .path::before, .hit-remote .path::before {
    content: ""; display: inline-block; vertical-align: middle;
    width: 5px; height: 5px; border-radius: 50%;
    margin-right: 6px; background: var(--primary);
  }
  .hit-remote .path::before { background: none; border: 1px solid var(--muted); }
  .version { margin: 14px 0 0; text-align: center; font-size: 11px; color: var(--muted); opacity: .75; }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .dialog-actions button { height: 44px; padding: 0 20px; border-radius: 999px; font-size: 14px;
                           font-weight: 500; color: var(--muted);
                           transition: background .2s var(--ease), color .2s var(--ease), transform .22s var(--spring); }
  .dialog-actions button:hover { background: var(--surface-2); color: var(--text); }
  .dialog-actions .primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .dialog-actions button:active { transform: scale(0.95); }


  /* ================= ESTILOS ================= */

  /* ---------- VIVO: Material You, color saturado y formas blandas ---------- */
  html[data-style="material"] {
    --tile: 74px; --r-face: 24px; --r-mini: 8px; --r-app: 18px;
    --field-h: 64px; --r-field: 999px; --r-chip: 999px;
    --blur-1: 20px; --blur-2: 26px; --blur-3: 30px; --sat: 165%;
    --mesh-op: 0.75;
    --label-fs: 12.5px; --label-tt: none; --label-ls: -0.011em;
  }
  html[data-style="material"] .face.folder { gap: 5px; padding: 9px; }

  /* ---------- CLASICO: Mac OS X de la vieja escuela ---------- */
  html[data-style="clasico"] {
    --font: "Helvetica Neue", "Lucida Grande", "Nimbus Sans", Helvetica, Arial, sans-serif;
    --font-display: var(--font);
    --tile: 70px;
    --r-face: 15px; --r-mini: 5px; --r-app: 13px; --r-panel: 10px;
    --field-h: 46px; --r-field: 999px; --r-chip: 999px;
    --blur-1: 10px; --blur-2: 14px; --blur-3: 16px; --sat: 118%;
    --mesh-op: 0.14;
    --label-fs: 12px; --label-tt: none; --label-ls: 0;
    --grid-gap: 24px 12px;

    --bg:        oklch(0.30 0.012 250);
    --bg-2:      oklch(0.34 0.014 250);
    --surface:   oklch(0.38 0.012 250 / 0.92);
    --surface-2: oklch(0.44 0.014 250 / 0.95);
    --outline:   oklch(0.20 0.010 250 / 0.75);
    --text:      oklch(0.96 0.004 250);
    --muted:     oklch(0.78 0.008 250);
    --primary:   oklch(0.62 0.150 var(--hue));
    --on-primary:oklch(0.99 0.005 var(--hue));
    --shadow:    0 1px 3px oklch(0 0 0 / 0.45);
    --glass:     inset 0 1px 0 0 oklch(1 0 0 / 0.16);
  }
  html[data-style="clasico"][data-mode="light"] {
    --bg:        oklch(0.90 0.004 250);
    --bg-2:      oklch(0.955 0.003 250);
    --surface:   oklch(0.985 0.002 250 / 0.94);
    --surface-2: oklch(0.93 0.004 250);
    --outline:   oklch(0.66 0.008 250 / 0.85);
    --text:      oklch(0.22 0.010 250);
    --muted:     oklch(0.44 0.008 250);
    --primary:   oklch(0.55 0.170 var(--hue));
    --on-primary:oklch(0.99 0.005 250);
    --shadow:    0 1px 2px oklch(0.2 0.01 250 / 0.28);
    --glass:     inset 0 1px 0 0 oklch(1 0 0 / 0.9);
  }

  /* fondo con degradado vertical, nada de manchas de color */
  html[data-style="clasico"] .mesh { opacity: var(--mesh-op); filter: blur(120px) saturate(60%); }
  html[data-style="clasico"] body {
    background-image: linear-gradient(180deg,
      oklch(from var(--bg) calc(l + 0.05) c h), var(--bg) 55%,
      oklch(from var(--bg) calc(l - 0.03) c h));
    background-attachment: fixed;
  }

  html[data-style="clasico"] .now .h { font-weight: 300; font-size: 42px; letter-spacing: -0.02em; }
  html[data-style="clasico"] .now .d { font-size: 12px; letter-spacing: 0; }
  html[data-style="clasico"] .topbar { border-bottom: 1px solid var(--outline); padding-bottom: 16px; }

  /* campo de busqueda hundido, como los buscadores de OS X */
  html[data-style="clasico"] .field {
    background: var(--surface);
    box-shadow: inset 0 1px 3px oklch(0 0 0 / 0.22), 0 1px 0 oklch(1 0 0 / 0.35);
    border-color: var(--outline);
    padding-left: 18px;
  }
  html[data-style="clasico"] .field:focus-within { transform: none; }
  html[data-style="clasico"] #q { font-size: 15px; }

  /* botones con degradado vertical y bisel de 1px */
  html[data-style="clasico"] .icon-btn,
  html[data-style="clasico"] .engine-chip,
  html[data-style="clasico"] .mini-btn,
  html[data-style="clasico"] .dialog-actions button {
    background-image: linear-gradient(180deg, oklch(1 0 0 / 0.16), oklch(0 0 0 / 0.07));
    box-shadow: var(--glass), var(--shadow);
    border: 1px solid var(--outline);
  }
  html[data-style="clasico"] .icon-btn { border-radius: 8px; width: 38px; height: 38px; }
  html[data-style="clasico"] .icon-btn svg { width: 17px; height: 17px; }
  html[data-style="clasico"] .icon-btn:hover { transform: none; filter: brightness(1.12); }

  /* iconos con brillo superior y sombra proyectada, estilo Aqua */
  html[data-style="clasico"] .face.single,
  html[data-style="clasico"] .app-icon,
  html[data-style="clasico"] .mini { position: relative; }
  html[data-style="clasico"] .face.single::before,
  html[data-style="clasico"] .app-icon::before,
  html[data-style="clasico"] .mini::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.42), oklch(1 0 0 / 0.02) 52%, oklch(0 0 0 / 0.14));
    pointer-events: none;
  }
  html[data-style="clasico"] .face.single,
  html[data-style="clasico"] .app-icon {
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.55), 0 2px 4px oklch(0 0 0 / 0.32);
  }
  html[data-style="clasico"] .face.folder {
    gap: 4px; padding: 8px;
    background-image: linear-gradient(180deg, oklch(1 0 0 / 0.14), oklch(0 0 0 / 0.06));
  }
  html[data-style="clasico"] .tile:hover .face { transform: translateY(-2px) scale(1.03); }
  html[data-style="clasico"] .tile-host { display: none; }
  html[data-style="clasico"] .panel { background-image: linear-gradient(180deg, oklch(1 0 0 / 0.08), transparent); }
  html[data-style="clasico"] dialog {
    background-image: linear-gradient(180deg, oklch(1 0 0 / 0.10), transparent 120px);
  }
  html[data-style="clasico"] .hits { border-radius: 8px; }

  /* ---------- CRISTAL: vidrio profundo, iconos con brillo, escala amplia ---------- */
  html[data-style="cristal"] {
    --tile: 84px;
    --r-face: 26px; --r-mini: 9px; --r-app: 21px; --r-panel: 38px;
    --field-h: 72px; --r-field: 999px; --r-chip: 999px;
    --blur-1: 40px; --blur-2: 58px; --blur-3: 72px; --sat: 260%;
    --mesh-op: 1;
    --icon-gloss: 1;
    --grid-gap: 28px 18px;
    --label-fs: 13px;

    --surface:   oklch(0.55 0.050 var(--hue) / 0.10);
    --surface-2: oklch(0.62 0.060 var(--hue) / 0.14);
    --outline:   oklch(1 0.02 var(--hue) / 0.42);
    --text:      oklch(0.98 0.010 var(--hue));
    --muted:     oklch(0.86 0.020 var(--hue) / 0.8);
    --primary:   oklch(0.88 0.105 var(--hue));
    --shadow:    0 30px 70px -26px oklch(0.04 0.03 var(--hue) / 0.75);
    --glass: inset 0 1.5px 0 0 oklch(1 0 0 / 0.7), inset 0 -1.5px 0 0 oklch(1 0 0 / 0.16),
             inset 1px 0 0 0 oklch(1 0 0 / 0.2), inset -1px 0 0 0 oklch(1 0 0 / 0.12),
             inset 3px 3px 9px -6px oklch(0.86 0.16 200 / 0.55),
             inset -3px -3px 9px -6px oklch(0.78 0.17 330 / 0.45);
  }
  html[data-style="cristal"][data-mode="light"] {
    /* mas opacidad y menos color de fondo: con 0.38 el texto quedaba ilegible */
    --mesh-op: 0.85;
    --sat: 185%;
    --surface:   oklch(1 0.010 var(--hue) / 0.42);
    --surface-2: oklch(1 0.012 var(--hue) / 0.54);
    --outline:   oklch(0.55 0.03 var(--hue) / 0.30);
    --bg:        oklch(0.94 0.010 var(--hue));
    --bg-2:      oklch(0.98 0.006 var(--hue));
    --text:      oklch(0.24 0.030 var(--hue));
    --muted:     oklch(0.42 0.025 var(--hue));
    --primary:   oklch(0.52 0.140 var(--hue));
    --on-primary:oklch(0.99 0.008 var(--hue));
    --shadow:    0 24px 50px -30px oklch(0.35 0.05 var(--hue) / 0.42);
    --glass: inset 0 1.5px 0 0 oklch(1 0 0 / 1), inset 0 -1.5px 0 0 oklch(0.55 0.03 var(--hue) / 0.18),
             inset 1px 0 0 0 oklch(1 0 0 / 0.5);
  }
  /* el reflejo de los iconos se atenua en claro, si no los quema */
  html[data-style="cristal"][data-mode="light"] .face.single::before,
  html[data-style="cristal"][data-mode="light"] .app-icon::before,
  html[data-style="cristal"][data-mode="light"] .mini::before {
    background: linear-gradient(180deg, oklch(1 0 0 / 0.28), oklch(1 0 0 / 0.02));
  }
  html[data-style="cristal"][data-mode="light"] .blob { filter: saturate(125%) brightness(1.22); }
  html[data-style="cristal"] .blob { filter: saturate(150%); }
  html[data-style="cristal"] .mesh::after {
    content: ""; position: absolute; border-radius: 50%;
    width: 38vw; height: 38vw; right: 22%; bottom: 6%;
    background: oklch(0.66 0.17 calc(var(--hue) + 150) / 0.42);
    animation: drift1 30s var(--ease) infinite alternate;
  }
  html[data-style="cristal"] .now .h { font-size: 46px; font-weight: 700; letter-spacing: -0.042em; }
  html[data-style="cristal"] .face.folder { gap: 6px; padding: 11px; }
  html[data-style="cristal"] .face.single { font-size: 34px; }
  html[data-style="cristal"] .face.single img { width: 42px; height: 42px; }
  html[data-style="cristal"] .icon-btn,
  html[data-style="cristal"] .engine-chip,
  html[data-style="cristal"] .mini-btn,
  html[data-style="cristal"] .segmented { box-shadow: var(--glass); }
  html[data-style="cristal"] .tile:hover .face { transform: translateY(-6px) scale(1.07); }
  html[data-style="cristal"] .app-icon { width: 64px; height: 64px; }
  /* el panel de ajustes tambien es de vidrio, si no rompe la ilusion */
  html[data-style="cristal"] dialog {
    background: var(--surface-2);
    -webkit-backdrop-filter: blur(var(--blur-3)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur-3)) saturate(var(--sat));
    box-shadow: var(--shadow), var(--glass);
  }
  html[data-style="cristal"] .segmented,
  html[data-style="cristal"] label input[type="text"],
  html[data-style="cristal"] label select { box-shadow: var(--glass); }

  /* destello diagonal: es lo que hace que se lea como vidrio y no como capa translucida */
  html[data-style="cristal"] .field,
  html[data-style="cristal"] .panel,
  html[data-style="cristal"] .face,
  html[data-style="cristal"] .hits,
  html[data-style="cristal"] .icon-btn { position: relative; overflow: hidden; }
  html[data-style="cristal"] .field::after,
  html[data-style="cristal"] .panel::after,
  html[data-style="cristal"] .face::after,
  html[data-style="cristal"] .hits::after,
  html[data-style="cristal"] .icon-btn::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    border-radius: inherit;
    background: linear-gradient(118deg,
      oklch(1 0 0 / 0.26) 0%, oklch(1 0 0 / 0.07) 26%, transparent 48%);
  }
  /* refuerzo de contraste del texto sobre vidrio muy transparente */
  html[data-style="cristal"] .tile-label,
  html[data-style="cristal"] .app-label,
  html[data-style="cristal"] .now .h,
  html[data-style="cristal"] .now .d { text-shadow: 0 1px 3px oklch(0.1 0.02 var(--hue) / 0.45); }
  html[data-style="cristal"][data-mode="light"] .tile-label,
  html[data-style="cristal"][data-mode="light"] .app-label,
  html[data-style="cristal"][data-mode="light"] .now .h,
  html[data-style="cristal"][data-mode="light"] .now .d { text-shadow: 0 1px 2px oklch(1 0 0 / 0.65); }

  /* reflejo especular sobre los iconos, solo en Cristal */
  html[data-style="cristal"] .face.single,
  html[data-style="cristal"] .app-icon,
  html[data-style="cristal"] .mini { position: relative; }
  html[data-style="cristal"] .face.single::before,
  html[data-style="cristal"] .app-icon::before,
  html[data-style="cristal"] .mini::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 52%;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.42), oklch(1 0 0 / 0.04));
    pointer-events: none;
  }
  html[data-style="cristal"] .face.single,
  html[data-style="cristal"] .app-icon {
    box-shadow: var(--shadow), inset 0 1px 0 0 oklch(1 0 0 / 0.5);
  }


  /* ---------- MINIMO: monocromo, sin sombras, todo hairline ---------- */
  html[data-style="minimo"] {
    --font: "Inter", "Helvetica Neue", "Noto Sans", "Cantarell", system-ui, sans-serif;
    --font-display: var(--font);
    --tile: 58px;
    --r-face: 3px; --r-mini: 1px; --r-app: 3px; --r-panel: 4px;
    --field-h: 54px; --r-field: 3px; --r-chip: 3px;
    --blur-1: 0px; --blur-2: 0px; --blur-3: 0px; --sat: 100%;
    --mesh-op: 0;
    --grid-gap: 36px 18px;
    --label-fs: 11px; --label-tt: none; --label-ls: 0.03em;
    --glass: 0 0 0 0 transparent;

    --bg:        oklch(0.155 0 0);
    --bg-2:      oklch(0.20 0 0);
    --surface:   oklch(0.155 0 0);
    --surface-2: oklch(0.225 0 0);
    --outline:   oklch(0.44 0 0 / 0.65);
    --text:      oklch(0.94 0 0);
    --muted:     oklch(0.60 0 0);
    --primary:   oklch(0.94 0.025 var(--hue));
    --on-primary:oklch(0.155 0 0);
    --shadow:    0 0 0 0 transparent;
    --scrim:     oklch(0.10 0 0 / 0.78);
  }
  html[data-style="minimo"][data-mode="light"] {
    --bg:        oklch(0.985 0 0);
    --bg-2:      oklch(1 0 0);
    --surface:   oklch(0.985 0 0);
    --surface-2: oklch(0.945 0 0);
    --outline:   oklch(0.74 0 0);
    --text:      oklch(0.18 0 0);
    --muted:     oklch(0.47 0 0);
    --primary:   oklch(0.26 0.03 var(--hue));
    --on-primary:oklch(0.99 0 0);
    --scrim:     oklch(0.98 0 0 / 0.8);
  }
  html[data-style="minimo"] .mesh { display: none; }
  html[data-style="minimo"] .now .h { font-weight: 200; font-size: 48px; letter-spacing: -0.03em; }
  html[data-style="minimo"] .now .d { font-size: 12px; color: var(--muted); }
  html[data-style="minimo"] .topbar { border-bottom: 1px solid var(--outline); padding-bottom: 20px; }

  /* iconos como contorno, sin relleno de color (el !important pisa el color en linea del JS) */
  html[data-style="minimo"] .face.single,
  html[data-style="minimo"] .app-icon,
  html[data-style="minimo"] .mini {
    background: transparent !important;
    border: 1px solid var(--outline);
    color: var(--text);
    font-weight: 400;
    box-shadow: none;
  }
  html[data-style="minimo"] .face.single { font-size: 21px; }
  html[data-style="minimo"] .app-icon { width: 50px; height: 50px; font-size: 18px; }
  html[data-style="minimo"] .mini { font-size: 9px; }
  html[data-style="minimo"] .face.folder {
    background: transparent; border: 1px solid var(--outline); gap: 4px; padding: 7px;
  }
  html[data-style="minimo"] .tile:hover .face { transform: none; border-color: var(--primary); }
  html[data-style="minimo"] .tile:active .face { transform: none; opacity: .6; }
  html[data-style="minimo"] .tile-host { display: none; }

  /* buscador reducido a una linea */
  html[data-style="minimo"] .field {
    background: transparent; box-shadow: none;
    border: 0; border-bottom: 1px solid var(--outline); border-radius: 0;
    padding-left: 0;
  }
  html[data-style="minimo"] .field:focus-within { transform: none; border-bottom-color: var(--primary); }
  html[data-style="minimo"] #q { font-size: 17px; font-weight: 300; }
  html[data-style="minimo"] .engine-chip { background: transparent; border: 1px solid var(--outline); }
  html[data-style="minimo"] .icon-btn { background: transparent; border-color: var(--outline); }
  html[data-style="minimo"] .icon-btn:hover { transform: none; border-color: var(--primary); }
  html[data-style="minimo"] .hits { border-radius: 3px; }
  html[data-style="minimo"] .panel { border-radius: 4px; }
  html[data-style="minimo"] .segmented,
  html[data-style="minimo"] .segmented button,
  html[data-style="minimo"] .mini-btn,
  html[data-style="minimo"] .dialog-actions button,
  html[data-style="minimo"] dialog { border-radius: 3px; }
  html[data-style="minimo"] .more-badge { background: transparent; color: var(--text);
                                          border: 1px solid var(--outline); font-weight: 400; }
  html[data-style="minimo"] .segmented { background: transparent; }
  html[data-style="minimo"] .segmented.styles { border-radius: 3px; }
  html[data-style="minimo"] label input[type="text"],
  html[data-style="minimo"] label select { border-radius: 3px; background: transparent; }

  /* ---------- FLUENT: el menú Inicio de Windows 11 ----------
     Lo que hace reconocible a Win11 no son los detalles finos, sino tres cosas muy visibles:
     el panel flotante acrílico con esquinas redondeadas y sombra marcada, el buscador en
     forma de píldora arriba, y la rejilla de iconos con degradado suave. El azul de
     Windows (#0078D4) sale del tono 258. */
  html[data-style="fluent"] {
    --font: "Segoe UI Variable Text", "Segoe UI", "Selawik", "Inter",
            "Noto Sans", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", var(--font);
    --tile: 62px;
    --r-face: 10px; --r-mini: 3px; --r-app: 10px; --r-panel: 12px;
    --field-h: 42px; --r-field: 999px; --r-chip: 999px;
    --blur-1: 40px; --blur-2: 50px; --blur-3: 60px; --sat: 160%;
    --mesh-op: 0.55;
    --grid-gap: 16px 6px;
    --label-fs: 12px; --label-tt: none; --label-ls: 0;
    --glass: 0 0 0 0 transparent;

    --bg:        #1C1C1C;
    --bg-2:      #2C2C2C;
    --surface:   rgba(44, 44, 44, 0.78);
    --surface-2: rgba(58, 58, 58, 0.86);
    --outline:   rgba(255, 255, 255, 0.09);
    --text:      #FFFFFF;
    --muted:     rgba(255, 255, 255, 0.62);
    --primary:   oklch(0.78 0.125 var(--hue));
    --on-primary: #1B1B1B;
    --shadow:    0 16px 40px rgba(0, 0, 0, 0.5);
    --scrim:     rgba(16, 16, 16, 0.5);
    --capa:      rgba(255, 255, 255, 0.07);
    --capa-2:    rgba(255, 255, 255, 0.11);
  }
  html[data-style="fluent"][data-mode="light"] {
    /* Mica en claro es casi neutro: gris muy claro con un tinte apenas perceptible.
       Heredar el 0.55 del modo oscuro lavaba la página de pasteles. */
    --mesh-op: 0.17;
    --sat: 122%;
    --bg:        #F3F3F3;
    --bg-2:      #FFFFFF;
    --surface:   rgba(251, 251, 251, 0.90);
    --surface-2: rgba(255, 255, 255, 0.95);
    --outline:   rgba(0, 0, 0, 0.07);
    --text:      #1B1B1B;
    --muted:     #5D5D5D;
    --primary:   oklch(0.55 0.155 var(--hue));
    --on-primary: #FFFFFF;
    --shadow:    0 16px 36px rgba(0, 0, 0, 0.16);
    --scrim:     rgba(233, 235, 238, 0.55);
    --capa:      rgba(0, 0, 0, 0.045);
    --capa-2:    rgba(0, 0, 0, 0.075);
  }

  /* el contenido entero flota como el menú Inicio: acrílico, redondeado y con sombra */
  html[data-style="fluent"] .wrap {
    max-width: 720px;
    margin: 40px auto;
    padding: 22px 26px 26px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--blur-3)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur-3)) saturate(var(--sat));
    border: 1px solid var(--outline);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 620px) {
    html[data-style="fluent"] .wrap {
      margin: 0; border-radius: 0; border: 0; box-shadow: none; background: transparent;
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
  }
  /* el fondo se ve de verdad detrás del acrílico */
  html[data-style="fluent"] .blob { filter: saturate(85%); }
  html[data-style="fluent"][data-mode="light"] .blob { filter: saturate(30%) brightness(1.12); }
  html[data-style="fluent"] .now .h { font-weight: 600; font-size: 32px; letter-spacing: -0.022em; }
  html[data-style="fluent"] .now .d { font-size: 12px; letter-spacing: 0; }

  /* buscador en píldora, como el del menú Inicio */
  html[data-style="fluent"] .field {
    background: var(--bg-2);
    border: 1px solid var(--outline);
    box-shadow: none;
    padding-left: 18px;
  }
  html[data-style="fluent"] .field:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 1px var(--primary);
    transform: none;
  }
  html[data-style="fluent"] #q { font-size: 14.5px; }

  html[data-style="fluent"] .icon-btn,
  html[data-style="fluent"] .engine-chip,
  html[data-style="fluent"] .mini-btn,
  html[data-style="fluent"] .dialog-actions button {
    background: var(--capa);
    border: 1px solid var(--outline);
    box-shadow: none;
  }
  html[data-style="fluent"] .icon-btn { width: 34px; height: 34px; border-radius: 6px; }
  html[data-style="fluent"] .icon-btn svg { width: 16px; height: 16px; }
  html[data-style="fluent"] .icon-btn:hover,
  html[data-style="fluent"] .engine-chip:hover,
  html[data-style="fluent"] .mini-btn:hover,
  html[data-style="fluent"] .dialog-actions button:hover {
    background: var(--capa-2); color: var(--text); transform: none;
  }
  html[data-style="fluent"] .icon-btn:active { transform: none; opacity: .7; }
  html[data-style="fluent"] .icon-btn.on,
  html[data-style="fluent"] .dialog-actions .primary {
    background: var(--primary); border-color: transparent; color: var(--on-primary);
  }

  /* rejilla de anclados: relleno de 5 px al pasar por encima */
  html[data-style="fluent"] .tile { padding: 8px 4px 6px; border-radius: 5px;
                                    transition: background .1s linear; }
  html[data-style="fluent"] .tile:hover { background: var(--capa); }
  html[data-style="fluent"] .tile:active { background: var(--capa-2); }
  html[data-style="fluent"] .tile:hover .face,
  html[data-style="fluent"] .tile:active .face { transform: none; }
  html[data-style="fluent"] .face { box-shadow: 0 2px 5px rgba(0,0,0,.16); border: 0; }
  html[data-style="fluent"] .face.folder {
    background: var(--capa-2); border: 1px solid var(--outline); gap: 4px; padding: 7px;
  }
  html[data-style="fluent"] .tile.drop-into .face { transform: scale(1.06); }
  html[data-style="fluent"] .app { padding: 8px 4px; border-radius: 5px; }
  html[data-style="fluent"] .app:hover { background: var(--capa); transform: none; }
  html[data-style="fluent"] .tile-host { display: none; }
  html[data-style="fluent"] .more-badge { border-radius: 999px; }

  /* iconos con el degradado suave de los iconos Fluent */
  html[data-style="fluent"] .face.single,
  html[data-style="fluent"] .app-icon,
  html[data-style="fluent"] .mini { position: relative; overflow: hidden; }
  html[data-style="fluent"] .face.single::after,
  html[data-style="fluent"] .app-icon::after,
  html[data-style="fluent"] .mini::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(142deg,
      rgba(255, 255, 255, 0.36) 0%, rgba(255, 255, 255, 0.06) 52%, rgba(0, 0, 0, 0.12) 100%);
  }
  html[data-style="fluent"] .app-icon { box-shadow: 0 2px 6px rgba(0,0,0,.18); }

  /* selección con la barrita de acento, como en NavigationView */
  html[data-style="fluent"] .hits {
    border-radius: 8px; padding: 4px; box-shadow: var(--shadow); border-color: var(--outline);
  }
  html[data-style="fluent"] .hit { border-radius: 5px; position: relative; }
  html[data-style="fluent"] .hit[aria-selected="true"] { background: var(--capa-2); color: var(--text); }
  html[data-style="fluent"] .hit[aria-selected="true"] .path { color: var(--muted); opacity: 1; }
  html[data-style="fluent"] .hit[aria-selected="true"]::before {
    content: ""; position: absolute; left: 3px; top: 50%;
    width: 3px; height: 16px; margin-top: -8px;
    border-radius: 2px; background: var(--primary);
  }

  html[data-style="fluent"] .panel { border-radius: 12px; border: 1px solid var(--outline); }
  html[data-style="fluent"] .panel-head { border-bottom: 1px solid var(--outline); padding-bottom: 12px; }
  html[data-style="fluent"] dialog { border-radius: 12px; background: var(--bg-2); }
  html[data-style="fluent"] .segmented {
    background: var(--capa); border: 1px solid var(--outline); border-radius: 6px; padding: 3px;
  }
  html[data-style="fluent"] .segmented button { border-radius: 4px; }
  html[data-style="fluent"] .segmented button:hover[aria-pressed="false"] { background: var(--capa); }
  html[data-style="fluent"] label input[type="text"],
  html[data-style="fluent"] label select {
    background: var(--bg-2); border-color: var(--outline); border-radius: 5px;
  }
  html[data-style="fluent"] .backup { border-radius: 5px; }

  html[data-style="fluent"] ::-webkit-scrollbar { width: 14px; height: 14px; }
  html[data-style="fluent"] ::-webkit-scrollbar-track { background: transparent; }
  html[data-style="fluent"] ::-webkit-scrollbar-thumb {
    background: var(--muted); border-radius: 999px;
    border: 5px solid transparent; background-clip: content-box;
  }
  html[data-style="fluent"] ::-webkit-scrollbar-thumb:hover {
    background: var(--text); background-clip: content-box;
  }

  /* ---------- BREEZE: KDE Plasma 6. Redondeado, translúcido y con desenfoque ----------
     Plasma 6 suavizó mucho el tema: los popups son translúcidos con blur, las esquinas
     pasaron a ser claramente redondeadas y la selección es un relleno azul suave, no un
     marco. Colores oficiales: vista #FCFCFC / #232629, ventana #EFF0F1 / #31363B.
     El azul Plasma (#3DAEE9) sale del tono semilla: elige el 236 para el aspecto de fábrica. */
  html[data-style="breeze"] {
    --font: "Noto Sans", "Inter", "Cantarell", "DejaVu Sans", system-ui, sans-serif;
    --font-display: var(--font);
    --tile: 66px;
    --r-face: 12px; --r-mini: 5px; --r-app: 12px; --r-panel: 14px;
    --field-h: 44px; --r-field: 10px; --r-chip: 8px;
    --blur-1: 18px; --blur-2: 26px; --blur-3: 32px; --sat: 130%;
    --mesh-op: 0.30;
    --grid-gap: 20px 10px;
    --label-fs: 12px; --label-tt: none; --label-ls: 0;
    --glass: 0 0 0 0 transparent;

    --bg:        #1E2226;
    --bg-2:      #2A2E33;
    --surface:   rgba(49, 54, 59, 0.72);
    --surface-2: rgba(62, 68, 74, 0.82);
    --outline:   rgba(255, 255, 255, 0.11);
    --text:      #FCFCFC;
    --muted:     #A6ADB4;
    --primary:   oklch(0.72 0.118 var(--hue));
    --on-primary: #FCFCFC;
    --shadow:    0 10px 30px -8px rgba(0, 0, 0, 0.55);
    --scrim:     rgba(18, 20, 23, 0.6);
    --realce:    color-mix(in oklab, var(--primary) 26%, transparent);
    --suave:     color-mix(in oklab, var(--primary) 13%, transparent);
  }
  html[data-style="breeze"][data-mode="light"] {
    --bg:        #E7E9EA;
    --bg-2:      #FCFCFC;
    --surface:   rgba(252, 252, 252, 0.80);
    --surface-2: rgba(255, 255, 255, 0.92);
    --outline:   rgba(0, 0, 0, 0.10);
    --text:      #232629;
    --muted:     #6E7377;
    --primary:   oklch(0.60 0.135 var(--hue));
    --on-primary: #FCFCFC;
    --shadow:    0 10px 26px -10px rgba(0, 0, 0, 0.22);
    --scrim:     rgba(231, 233, 234, 0.66);
    --realce:    color-mix(in oklab, var(--primary) 22%, transparent);
    --suave:     color-mix(in oklab, var(--primary) 11%, transparent);
  }

  /* un fondo de color muy tenue, como el escritorio detrás de un popup translúcido */
  html[data-style="breeze"] .blob { filter: saturate(60%) brightness(1.1); }
  html[data-style="breeze"] .now .h { font-weight: 500; font-size: 38px; letter-spacing: -0.018em; }
  html[data-style="breeze"] .now .d { font-size: 12.5px; letter-spacing: 0; }

  /* buscador de Kickoff: redondeado, translúcido, sin marco duro */
  html[data-style="breeze"] .field {
    background: var(--surface-2);
    border: 1px solid var(--outline);
    box-shadow: none;
    padding-left: 18px;
  }
  html[data-style="breeze"] .field:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--suave);
    transform: none;
  }
  html[data-style="breeze"] #q { font-size: 15px; }

  /* botones planos y redondeados; al pasar por encima se rellenan, no se enmarcan */
  html[data-style="breeze"] .icon-btn,
  html[data-style="breeze"] .engine-chip,
  html[data-style="breeze"] .mini-btn,
  html[data-style="breeze"] .dialog-actions button {
    background: var(--surface-2);
    border: 1px solid var(--outline);
    box-shadow: none;
  }
  html[data-style="breeze"] .icon-btn { width: 40px; height: 40px; border-radius: 10px; }
  html[data-style="breeze"] .icon-btn svg { width: 18px; height: 18px; }
  html[data-style="breeze"] .icon-btn:hover,
  html[data-style="breeze"] .engine-chip:hover,
  html[data-style="breeze"] .mini-btn:hover,
  html[data-style="breeze"] .dialog-actions button:hover {
    background: var(--suave); border-color: var(--primary); color: var(--text); transform: none;
  }
  html[data-style="breeze"] .icon-btn.on,
  html[data-style="breeze"] .dialog-actions .primary {
    background: var(--primary); border-color: transparent; color: var(--on-primary);
  }

  /* iconos a todo color y sin marco, con el realce detrás como en el lanzador */
  html[data-style="breeze"] .tile {
    padding: 9px 5px 7px;
    border-radius: 12px;
    transition: background .13s var(--ease), transform .18s var(--ease);
  }
  html[data-style="breeze"] .tile:hover { background: var(--suave); }
  html[data-style="breeze"] .tile:active { background: var(--realce); }
  html[data-style="breeze"] .face { box-shadow: none; border: 0; }
  html[data-style="breeze"] .face.folder {
    background: var(--surface-2);
    border: 1px solid var(--outline);
    gap: 5px; padding: 8px;
  }
  html[data-style="breeze"] .tile:hover .face { transform: none; border-color: var(--outline); }
  html[data-style="breeze"] .tile:active .face { transform: none; }
  html[data-style="breeze"] .tile.drop-into .face { transform: scale(1.06); border-color: var(--primary); }
  html[data-style="breeze"] .app-icon { box-shadow: none; }
  html[data-style="breeze"] .app { padding: 8px 4px; border-radius: 12px; }
  html[data-style="breeze"] .app:hover { background: var(--suave); transform: none; }
  html[data-style="breeze"] .tile-host { display: none; }
  html[data-style="breeze"] .more-badge { border-radius: 999px; }

  /* selección: relleno azul suave con el texto normal, no azul sólido con texto blanco */
  html[data-style="breeze"] .hits {
    border-radius: 12px; box-shadow: var(--shadow); padding: 4px;
  }
  html[data-style="breeze"] .hit { border-radius: 8px; }
  html[data-style="breeze"] .hit[aria-selected="true"] { background: var(--realce); color: var(--text); }
  html[data-style="breeze"] .hit[aria-selected="true"] .path { color: var(--muted); opacity: 1; }

  html[data-style="breeze"] .panel { border-radius: 14px; }
  html[data-style="breeze"] .panel-head { border-bottom: 1px solid var(--outline); padding-bottom: 14px; }
  html[data-style="breeze"] dialog { border-radius: 14px; background: var(--bg-2); }
  html[data-style="breeze"] .segmented {
    background: var(--surface); border: 1px solid var(--outline); border-radius: 10px; padding: 4px;
  }
  html[data-style="breeze"] .segmented button { border-radius: 7px; }
  html[data-style="breeze"] .segmented button:hover[aria-pressed="false"] { background: var(--suave); }
  html[data-style="breeze"] label input[type="text"],
  html[data-style="breeze"] label select {
    background: var(--surface-2); border-color: var(--outline); border-radius: 9px;
  }
  html[data-style="breeze"] .backup { border-radius: 9px; }

  /* barras de desplazamiento finas, al estilo Plasma */
  html[data-style="breeze"] ::-webkit-scrollbar { width: 12px; height: 12px; }
  html[data-style="breeze"] ::-webkit-scrollbar-track { background: transparent; }
  html[data-style="breeze"] ::-webkit-scrollbar-thumb {
    background: var(--muted); border-radius: 999px;
    border: 4px solid transparent; background-clip: content-box; opacity: .5;
  }
  html[data-style="breeze"] ::-webkit-scrollbar-thumb:hover {
    background: var(--primary); background-clip: content-box;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 20px 16px 70px; }
    .now .h { font-size: 32px; }
    .field { height: 56px; padding-left: 18px; }
    #q { font-size: 16px; }
    .engine-chip { padding: 0 14px; height: 40px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 20px 10px; }
    .face { width: 66px; height: 66px; border-radius: 21px; }
    .panel { padding: 22px 18px 26px; border-radius: 28px; }
  }
</style>
</head>
<body>

<div class="mesh" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<div class="wrap">
  <header class="topbar">
    <div class="now">
      <span class="h" id="time">--:--</span>
      <span class="d" id="date"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="editBtn" data-i18n-title="editTitle" data-i18n-aria="edit">
        <svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
      </button>
      <button class="icon-btn" id="cfgBtn" data-i18n-title="settings" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <p class="warn" id="storageWarn" data-i18n="storageWarn" hidden></p>

  <div class="console">
    <div class="field">
      <svg class="glass" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>

             data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel">

    </div>
    <div class="hits" id="hits" hidden role="listbox"></div>
  </div>

  <main class="grid" id="grid"></main>

  <p class="hint">
    <kbd>/</kbd> <span data-i18n="hintSearch"></span> ·
    <kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="hintPick"></span> ·
    <kbd>Ctrl</kbd>+<kbd>Enter</kbd> <span data-i18n="hintNewTab"></span> ·
    <kbd>E</kbd> <span data-i18n="hintEdit"></span> ·
    <kbd>Esc</kbd> <span data-i18n="hintClose"></span>
  </p>
</div>

<div class="scrim" id="scrim" hidden>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <input class="panel-title" id="panelTitle" readonly>
      <button class="icon-btn panel-close" id="panelClose" data-i18n-aria="close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="apps" id="apps"></div>
    <div class="panel-actions">
      <button class="text-btn" id="emptyFolder" data-i18n="emptyAll"></button>
      <button class="text-btn" id="delFolder" data-i18n="deleteFolder"></button>
    </div>
  </section>
</div>

<dialog id="linkDlg">
  <h2 id="linkDlgTitle"></h2>
  <label><span data-i18n="fieldName"></span><input type="text" id="lName"></label>
  <label><span data-i18n="fieldUrl"></span><input type="text" id="lUrl" data-i18n-placeholder="urlPlaceholder"></label>
  <label><span data-i18n="fieldLocation"></span><select id="lFolder"></select></label>
  <div class="dialog-actions">
    <button id="lCancel" data-i18n="cancel"></button>
    <button class="primary" id="lSave" data-i18n="save"></button>
  </div>
</dialog>

<dialog id="cfgDlg">
  <h2 data-i18n="settings"></h2>
  <label data-i18n="language" style="margin-bottom:6px"></label>
  <select id="cLang" style="margin-bottom:18px"></select>
  <label data-i18n="color" style="margin-bottom:6px"></label>
  <div class="seeds" id="seeds"></div>
  <div class="segmented" id="modes">
    <button data-mode="auto" data-i18n="modeAuto"></button>
    <button data-mode="light" data-i18n="modeLight"></button>
    <button data-mode="dark" data-i18n="modeDark"></button>
  </div>

  <label data-i18n="style" style="margin-bottom:6px"></label>
  <div class="segmented styles" id="styles">
    <button data-style="material" data-i18n="styleVivid"></button>
    <button data-style="clasico" data-i18n="styleClassic"></button>
    <button data-style="cristal" data-i18n="styleGlass"></button>
    <button data-style="minimo" data-i18n="styleMinimal"></button>
    <button data-style="fluent" data-i18n="styleFluent"></button>
    <button data-style="breeze" data-i18n="styleBreeze"></button>
  </div>
  <label><span data-i18n="engine"></span><select id="cEngine"></select></label>
  <label><span data-i18n="customTemplate"></span>
    <input type="text" id="cCustom" placeholder="https://search.example.com/?q=%s">
  </label>
  <label class="row"><input type="checkbox" id="cFavicons"> <span data-i18n="useFavicons"></span></label>

  <p class="section-title" data-i18n="suggestions"></p>
  <label class="row"><input type="checkbox" id="cHistory"> <span data-i18n="useHistory"></span></label>
  <label class="row"><input type="checkbox" id="cRemote"> <span data-i18n="useRemote"></span></label>
  <p class="aviso" data-i18n="remoteWarn"></p>
  <p class="aviso" id="sinSug" hidden></p>
  <div class="backup-tools">
    <button class="mini-btn" id="bClearHist" data-i18n="clearHistory"></button>
  </div>

  <p class="section-title" data-i18n="backups"></p>
  <ul class="backups" id="backups"></ul>
  <div class="backup-tools">
    <button class="mini-btn" id="bMake" data-i18n="makeBackup"></button>
    <button class="mini-btn" id="cExport" data-i18n="downloadFile"></button>
    <button class="mini-btn" id="cImport" data-i18n="restoreFile"></button>
  </div>

  <div class="dialog-actions">
    <button class="primary" id="cClose" data-i18n="done"></button>
  </div>
  <p class="version" id="version"></p>
  <input type="file" id="cFile" accept="application/json" hidden>
</dialog>

    for (var i = 0; i < list.length; i++) {

    if (txt === undefined) return key;
    if (vars) {

        txt = txt.split("{" + k + "}").join(vars[k]);

  function migrate(s) {
    if (!s || typeof s !== "object") return null;
    if (!s.items) {
      if (!s.folders) return null;
      s.items = s.folders.map(function (f) {
        return { kind: "folder", id: f.id || uid(), name: f.name || "Carpeta", links: f.links || [] };
      });

    s.items = (s.items || []).filter(Boolean).map(function (it) {

      return { kind: "folder", id: it.id || uid(), name: it.name || "Carpeta", links: it.links || [] };
    });

    s.version = 2;
    if (typeof s.hue !== "number") s.hue = 172;
    if (["auto", "light", "dark"].indexOf(s.mode) < 0) s.mode = "auto";

  function hexToHue(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h = 0;
    if (d === 0) h = 0;
    else if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60);
    return h < 0 ? h + 360 : h;

  function findLink(id) {

      var it = state.items[i];
      if (it.kind === "link" && it.id === id) return { where: "desktop", index: i, link: it };
      if (it.kind === "folder") {
        for (j = 0; j < it.links.length; j++) {

  /* ---------------- arrastrar y soltar (eventos de puntero) ----------------

  var drag = null;

  function dragStart(ev, id, el) {
    // Con ratón se puede arrastrar siempre: el umbral de 6 px distingue clic de arrastre.
    // Con dedo o lápiz exigimos modo edición, si no la página no podría desplazarse.
    if (ev.pointerType && ev.pointerType !== "mouse" &&
        !document.body.classList.contains("editing")) return;
    if (ev.button !== undefined && ev.button > 0) return;
    if (ev.target.closest(".tile-del, .app-del")) return;   // la × no arrastra
    drag = { id: id, el: el, x0: ev.clientX, y0: ev.clientY, activo: false, destino: null, zona: null };
  }

  function dragMove(ev) {
    if (!drag) return;
    if (!drag.activo) {
      // umbral: por debajo de 6 px se considera un clic, no un arrastre
      if (Math.abs(ev.clientX - drag.x0) + Math.abs(ev.clientY - drag.y0) < 6) return;
      drag.activo = true;
      drag.el.classList.add("dragging");
      var cara = drag.el.querySelector(".face, .app-icon");
      var r = cara.getBoundingClientRect();
      drag.ghost = cara.cloneNode(true);
      drag.ghost.classList.add("drag-ghost");
      drag.ghost.style.width = r.width + "px";
      drag.ghost.style.height = r.height + "px";
      // se agarra por el punto exacto donde pinchaste, no por el centro
      drag.offX = drag.x0 - r.left;
      drag.offY = drag.y0 - r.top;
      document.body.appendChild(drag.ghost);
    }
    ev.preventDefault();
    drag.ghost.style.transform =
      "translate(" + (ev.clientX - drag.offX) + "px," + (ev.clientY - drag.offY) + "px) " +
      "scale(1.1) rotate(-2deg)";

    var mejor = null, mejorD = Infinity, despues = false;
    for (var i = 0; i < nodos.length; i++) {
      if (nodos[i].dataset.dragId === drag.id) continue;   // no se compara consigo mismo
      var r = nodos[i].getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < mejorD) { mejorD = d; mejor = nodos[i]; despues = x > cx; }
    }
    return mejor ? { el: mejor, despues: despues, dist: Math.sqrt(mejorD) } : null;
  }

  function esCarpetaArrastrada() {
    return state.items.some(function (x) { return x.id === drag.id && x.kind === "folder"; });
  }

  function limpiarMarcas() {
    var m = document.querySelectorAll(".drop-into, .shift-before, .shift-after");
    Array.prototype.forEach.call(m, function (el) {
      // se corta la transición para que la medida del FLIP sea la posición real
      el.style.transition = "none";
      el.classList.remove("drop-into", "shift-before", "shift-after");
      void el.offsetWidth;
      el.style.transition = "";
    });
  }

  function marcarDestino(x, y) {
    var bajo = document.elementFromPoint(x, y);   // el fantasma no estorba: pointer-events none
    var exacto = bajo ? bajo.closest("[data-drag-id]") : null;
    if (exacto && exacto.dataset.dragId === drag.id) exacto = null;

    var panelAbierto = !scrim.hidden;
    var cont = panelAbierto ? appsEl : gridEl;
    var dentro = cont.getBoundingClientRect();
    var enCont = x >= dentro.left - 40 && x <= dentro.right + 40 &&
                 y >= dentro.top - 40 && y <= dentro.bottom + 40;

    var t = null, despues = false;
    // soltar justo encima de una carpeta la abre como destino; en cualquier otro
    // caso vale el icono más cercano, que perdona los huecos entre iconos
    if (exacto && exacto.dataset.dragKind === "folder") {
      t = exacto;
    } else if (enCont) {
      var c = masCercano(cont, x, y);
      if (c) { t = c.el; despues = c.despues; }
    }

    var modo = (t && t.dataset.dragKind === "folder" && t === exacto && !esCarpetaArrastrada())
             ? "into" : "reorder";

    if (drag.destino !== t || drag.modo !== modo || drag.despues !== despues) {
      limpiarMarcas();
      if (t) {
        if (modo === "into") t.classList.add("drop-into");
        else t.classList.add(despues ? "shift-after" : "shift-before");
      }
      drag.destino = t;
      drag.modo = modo;
      drag.despues = despues;
    }

    var zona = null;
    if (bajo === scrim) zona = "scrim";
    else if (enCont && !panelAbierto) zona = "grid";
    if (drag.zona !== zona) {
      gridEl.classList.toggle("drop-here", zona === "grid" && !t);
      scrim.classList.toggle("drop-here", zona === "scrim");
      drag.zona = zona;
    }
  }

  function dragEnd() {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (d.ghost) {
      // el icono aterrizará deslizándose desde donde lo has soltado, no desde su hueco viejo
      var gr = d.ghost.getBoundingClientRect();
      aterrizaje = { id: d.id, x: gr.left, y: gr.top };
      d.ghost.remove();
    }
    d.el.classList.remove("dragging");
    limpiarMarcas();
    gridEl.classList.remove("drop-here");
    scrim.classList.remove("drop-here");
    if (!d.activo) return;                 // fue un clic normal
    acabaDeArrastrar = true;               // impide que el clic abra el enlace
    soltar(d);
  }

  // moveToFolder inserta ANTES de una referencia; si queremos dejarlo después,
  // la referencia pasa a ser el siguiente enlace de la carpeta
  function refSiguiente(id, despues) {
    if (!despues) return id;
    var f = state.items.filter(function (i) { return i.kind === "folder" && i.id === openId; })[0];
    if (!f) return id;
    var at = f.links.findIndex(function (x) { return x.id === id; });
    return (at >= 0 && f.links[at + 1]) ? f.links[at + 1].id : null;
  }

  function soltar(d) {
    var enEscritorio = state.items.some(function (x) { return x.id === d.id; });
    var esCarpeta = state.items.some(function (x) { return x.id === d.id && x.kind === "folder"; });

    if (d.destino) {
      var destId = d.destino.dataset.dragId;
      var destKind = d.destino.dataset.dragKind;

      if (d.modo === "into") {
        moveToFolder(d.id, destId, null);             // soltado justo encima de la carpeta
      } else if (destKind === "app") {                // reordenar dentro de la carpeta abierta
        moveToFolder(d.id, openId, refSiguiente(destId, d.despues));
      } else if (enEscritorio) {
        reorderItem(d.id, destId, d.despues);         // reordenar en el escritorio
      } else {
        moveToDesktop(d.id, destId);                  // sacarlo de la carpeta a esa posición
      }
      return;
    }

    if (d.zona === "grid" && !enEscritorio) moveToDesktop(d.id, null);
    else if (d.zona === "scrim") { moveToDesktop(d.id, null); closeFolder(); }
  }

  function reorderItem(fromId, toId, despues) {
    if (fromId === toId) return;
    var from = state.items.findIndex(function (i) { return i.id === fromId; });
    if (from < 0) return;
    var moved = state.items.splice(from, 1)[0];
    // el índice del destino se calcula tras quitar el origen, si no se descuadra
    var to = state.items.findIndex(function (i) { return i.id === toId; });
    if (to < 0) state.items.push(moved);
    else state.items.splice(despues ? to + 1 : to, 0, moved);
    commit();
  }

    var m = {};

    Array.prototype.forEach.call(nodos, function (el) {

    var nodos = document.querySelectorAll("[data-drag-id]");

      var a = antes[el.dataset.dragId];
      if (aterrizaje && aterrizaje.id === el.dataset.dragId) a = aterrizaje;
      if (!a) return;                            // icono nuevo: aparece sin deslizar
      var r = el.getBoundingClientRect();
      var dx = a.x - r.left, dy = a.y - r.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.animate(
        [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
        { duration: 280, easing: "cubic-bezier(0.2, 0.9, 0.25, 1.05)" }
      );
    });

  /* ---------------- panel de carpeta ---------------- */

  function openFolder(id, fromEl) {
    openId = id;

    titleEl.value = f.name;
    titleEl.readOnly = !document.body.classList.contains("editing");

  function closeFolder() {
    if (openId === null) return;
    var anim = morph(originEl, panel, true);
    scrim.classList.remove("open");
    var done = function () {
      scrim.hidden = true;
      document.body.classList.remove("locked");
      openId = null; originEl = null;
    };
    if (anim && anim.finished) anim.finished.then(done).catch(done);
    else window.setTimeout(done, 260);

  function morph(fromEl, toEl, reverse) {
    if (!fromEl || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
    var a = fromEl.getBoundingClientRect();
    var b = toEl.getBoundingClientRect();
    if (!b.width || !b.height) return null;

    var sx = a.width / b.width;
    var sy = a.height / b.height;
    var dx = (a.left + a.width / 2) - (b.left + b.width / 2);
    var dy = (a.top + a.height / 2) - (b.top + b.height / 2);

    var cs = getComputedStyle(document.documentElement);
    var rFace = cs.getPropertyValue("--r-face").trim() || "24px";
    var rPanel = cs.getPropertyValue("--r-panel").trim() || "32px";
    var closed = { transform: "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")",
                   opacity: 0.2, borderRadius: rFace };
    var opened = { transform: "none", opacity: 1, borderRadius: rPanel };

    return toEl.animate(reverse ? [opened, closed] : [closed, opened], {
      duration: reverse ? 240 : 340,
      easing: reverse ? "cubic-bezier(0.4,0,1,1)" : "cubic-bezier(0.2,0.9,0.25,1.2)",
      fill: "both"

  /* ---------------- buscador ---------------- */
  var q = document.getElementById("q");
  var hits = document.getElementById("hits");
